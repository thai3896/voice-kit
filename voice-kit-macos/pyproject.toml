[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-kit-macos"
version = "0.1.0"
description = "Open Super Whisper macOS desktop client with floating HUD, global hotkeys, and voice-editor API integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thai Nguyen", email = "thai@example.com" }
]
dependencies = [
    "PyQt6>=6.5.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "websockets>=12.0",
    "openai>=1.14.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0.1",
    "torch>=2.0.0",
    "silero-vad>=0.1.0",
]

[project.scripts]
voice-kit = "src.main:main"
